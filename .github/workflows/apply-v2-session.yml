name: Verify and apply V2 DRAFT session storage
on:
  push:
    branches: [feat/test-single-draft-session]
    paths: [.github/workflows/apply-v2-session.yml]
permissions:
  contents: write
concurrency:
  group: mflow-v2-session-apply
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/test-single-draft-session'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and apply pinned patch
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 75663d18e42fffefccbafea49b06a9810cc81134 HEAD
          base64 --decode .github/v2-session.patch.gz.b64 > /tmp/v2.patch.gz
          echo 'ff7a34883727fd37740b4929e8a2314be0cb4c23732b6aab40e8e6b2d583f081  /tmp/v2.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v2.patch.gz > /tmp/v2.patch
          git apply --index --check --unidiff-zero /tmp/v2.patch
          git apply --index --unidiff-zero /tmp/v2.patch
          test -z "$(git diff --cached --name-only -- .github/workflows)"
      - name: Regressions, Graph adapter and TEST build
        run: |
          npm install --no-audit --no-fund
          npm test
          VITE_MFLOW_TEST_PREVIEW=1 npm run build -- --base=/Flow-LPS-Uploader/test/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Existing actual Uploader consent regression
        run: python scripts/full-sync-consent-browser.py
      - name: Commit only verified application source
        run: |
          test "$(git ls-remote origin refs/heads/feat/test-single-draft-session | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(test): append-only V1 closure and single V2 DRAFT start resume and revisions'
          git push origin HEAD:refs/heads/feat/test-single-draft-session
          git rev-parse HEAD
