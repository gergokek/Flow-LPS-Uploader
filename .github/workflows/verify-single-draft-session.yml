name: Verify isolated single DRAFT TEST session
on:
  push:
    branches: [feat/test-single-draft-session]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Unit and regression tests
        run: npm test
      - name: Build static TEST assets only
        run: npm run build
      - name: Ensure no deploy step
        run: |
          test -d dist
          test "$GITHUB_REF_NAME" = 'feat/test-single-draft-session'
