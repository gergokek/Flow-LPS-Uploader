name: Verify and apply V2 approval and full sync storage
on:
  push:
    branches: [feat/test-single-draft-session]
    paths: [.github/workflows/apply-v2-approval-sync.yml]
permissions:
  contents: write
concurrency:
  group: mflow-v2-approval-sync-apply
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/test-single-draft-session'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact reviewed source patch
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor 471daf996e44a083fa5683730b4f9e41f155db40 HEAD
          cat .github/v2-flow.patch.part1.b64 .github/v2-flow.patch.part2.b64 .github/v2-flow.patch.part3.b64 .github/v2-flow.patch.part4.b64 | base64 --decode > /tmp/v2-flow.patch.gz
          echo 'bfc71f47a21256a4fc0a76d56b77d3213d19be4adb905f5e1b8c3ad1106afef6  /tmp/v2-flow.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v2-flow.patch.gz > /tmp/v2-flow.patch
          git apply --index --check /tmp/v2-flow.patch
          git apply --index /tmp/v2-flow.patch
          test -z "$(git diff --cached --name-only -- .github/workflows)"
      - name: Regressions, actual Graph adapter and TEST build
        run: |
          npm install --no-audit --no-fund
          npm test
          VITE_MFLOW_TEST_PREVIEW=1 npm run build -- --base=/Flow-LPS-Uploader/test/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser tools and existing consent regression
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
          python scripts/full-sync-consent-browser.py
      - name: Commit checked TEST source, no project data writes
        run: |
          test "$(git ls-remote origin refs/heads/feat/test-single-draft-session | cut -f1)" = "$GITHUB_SHA"
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(test): immutable V2 approval full sync journals and explicit run consent'
          git push origin HEAD:refs/heads/feat/test-single-draft-session
          git rev-parse HEAD
