name: Verify and apply explicit note reconciliation
on:
  push:
    branches: [feat/test-single-draft-session]
    paths: [.github/workflows/apply-note-reconciliation.yml]
permissions:
  contents: write
concurrency:
  group: mflow-note-reconciliation-apply
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/test-single-draft-session'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply exact reviewed patch
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor bb7c89c160fd8ee2e36d2be7dbefb188e1ad521f HEAD
          cat .github/note-reconciliation.part1.b64 .github/note-reconciliation.part2.b64 | base64 --decode > /tmp/note.patch.gz
          echo 'e872548980e784837889e55166a7916fe71d086b00f7c6c810e4350a21d44ac1  /tmp/note.patch.gz' | sha256sum -c -
          gzip -dc /tmp/note.patch.gz > /tmp/note.patch
          git apply --index --check /tmp/note.patch
          git apply --index /tmp/note.patch
          test -z "$(git diff --cached --name-only -- .github/workflows)"
      - name: Full regressions and locked TEST build
        run: |
          npm install --no-audit --no-fund
          npm test
          VITE_MFLOW_TEST_PREVIEW=1 npm run build -- --base=/Flow-LPS-Uploader/test/
      - name: Isolated browser dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Actual callback explicit consent and recovery description
        run: python scripts/full-sync-consent-browser.py
      - name: Commit only tested application source
        run: |
          test "$(git ls-remote origin refs/heads/feat/test-single-draft-session | cut -f1)" = "$GITHUB_SHA"
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(test): reconcile explicitly accepted note representation without replaying writes'
          git push origin HEAD:refs/heads/feat/test-single-draft-session
          git rev-parse HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: note-reconciliation-consent-proof
          path: artifacts/consent/
          retention-days: 7
